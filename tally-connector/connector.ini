[tally]
; Tally must have: F1 (Help) > Settings > Connectivity > "TallyPrime acts as" = Both, Port = 9000
url = http://localhost:9000
; Leave empty if only one company is open in Tally. Otherwise type the exact company name.
company =
timeout = 180

[dashboard]
; The address of the dashboard website, e.g. https://accounts.yourcompany.in
url = http://127.0.0.1:8100
; Paste the connector key from the dashboard: Settings > Tally link > Create connector key
token = vbt_demo_key_for_local_testing_only

[sync]
; How often new figures are sent (minutes)
minutes = 10
; Once a day after this hour, everything is read again (removes entries deleted in Tally)
full_refresh_hour = 9
; How many past financial years to keep besides this one
past_years = 1
