# /etc/nginx/sites-available/accounts  — example for accounts.<company-domain>, proxied by Cloudflare.
# Use Cloudflare "Full (strict)" SSL with an origin certificate at the paths below.
server {
    listen 443 ssl http2;
    server_name accounts.example.com;   # replace (checklist C20)

    ssl_certificate     /etc/ssl/cloudflare/accounts.pem;
    ssl_certificate_key /etc/ssl/cloudflare/accounts.key;

    client_max_body_size 6m;            # attachments are capped at 5 MB in the app
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Optional: allow only office IPs / VPN
    # allow 203.0.113.10; deny all;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
    }
}
